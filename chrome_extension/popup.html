<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDE Tercihi</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <div class="popup-header">
            <h2>🚀 IDE Tercihi</h2>
            <p>Kodları hangi editöre göndermek istiyorsunuz?</p>
        </div>
        
        <div class="ide-options">
            <button class="ide-option cursor-option" data-ide="cursor">
                <div class="ide-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2 12C2 6.48 6.48 2 12 2s10 4.48 10 10-4.48 10-10 10S2 17.52 2 12zm4.64-1.96l3.54 3.54c.78.78 2.05.78 2.83 0l7.07-7.07c.78-.78.78-2.05 0-2.83L16.54 1.96c-.78-.78-2.05-.78-2.83 0L6.64 9.04c-.78.78-.78 2.05 0 2.83z"/>
                    </svg>
                </div>
                <div class="ide-info">
                    <h3>Cursor</h3>
                </div>
            </button>
            
            <button class="ide-option vscode-option" data-ide="vscode">
                <div class="ide-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M23.15 2.587L18.21.21a1.494 1.494 0 0 0-1.705.29l-9.46 8.63-4.12-3.128a.999.999 0 0 0-1.276.057L.327 7.261A1 1 0 0 0 .326 8.74L3.899 12 .326 15.26a1 1 0 0 0 .001 1.479L1.65 17.94a.999.999 0 0 0 1.276.057l4.12-3.128 9.46 8.63a1.492 1.492 0 0 0 1.704.29l4.942-2.377A1.5 1.5 0 0 0 24 20.06V3.939a1.5 1.5 0 0 0-.85-1.352z"/>
                    </svg>
                </div>
                <div class="ide-info">
                    <h3>Visual Studio Code</h3>
                </div>
            </button>
        </div>
        
        <div class="system-instructions-section">
            <h3>🤖 Sistem Talimatları</h3>
            <p>AI modeline gönderilecek ton ve stil talimatları</p>
            
            <div class="auto-apply-toggle">
                <label class="toggle-label">
                    <input type="checkbox" id="autoApplyToggle" />
                    <span class="toggle-slider"></span>
                    <span class="toggle-text">Otomatik Uygula</span>
                </label>
                <span class="toggle-description">Sayfa yenilendiğinde talimatları otomatik uygula</span>
            </div>
            
            <textarea 
                id="systemInstructions" 
                placeholder="Örnek: Kodları Türkçe açıklamalarla yaz, modern JavaScript kullan..."
                rows="3"
            ></textarea>
            <div class="textarea-actions">
                <button id="saveInstructions" class="action-btn save-btn">💾 Kaydet</button>
                <button id="clearInstructions" class="action-btn clear-btn">🗑️ Temizle</button>
            </div>
        </div>
        
        <div class="popup-footer">
            <p class="note">Bu ayarlar bir kere seçilecek ve kaydedilecektir.</p>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
